<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星辰之引 | Stellar Guidance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #07050f;
            --accent-cyan: #00D8FF;
            --accent-violet: #8B5CF6;
            --indigo-glow: rgba(59, 13, 115, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: #E2E8F0;
            font-family: 'Noto Serif SC', serif;
            margin: 0;
            overflow: hidden;
            /* 优化移动端点击体验 */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* 核心动画关键帧 */
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes pulse-text {
            0% { opacity: 0.5; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(0, 216, 255, 0.5); }
            100% { opacity: 0.5; }
        }

        @keyframes music-beat {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(0, 216, 255, 0.4)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.8)); }
        }

        /* 液态玻璃效果 (Liquid Glass) */
        .glass-panel {
            background: rgba(10, 8, 20, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), 
                        inset 0 0 20px rgba(0, 216, 255, 0.05),
                        inset 0 0 40px rgba(139, 92, 246, 0.05);
            border-radius: 24px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 强调色按钮 */
        .btn-mystic {
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 4px rgba(0, 216, 255, 0.3);
        }

        .btn-mystic::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 216, 255, 0.15), rgba(139, 92, 246, 0.15));
            border-radius: 50%;
            transition: transform 0.6s ease;
            z-index: -1;
        }

        .btn-mystic:hover::before {
            transform: translate(-50%, -50%) scale(2);
        }

        .btn-mystic:hover {
            box-shadow: 0 0 25px rgba(0, 216, 255, 0.4), 0 0 10px rgba(139, 92, 246, 0.3);
            text-shadow: 0 0 8px rgba(0, 216, 255, 0.8);
            border-color: #5eead4;
        }
        
        .btn-mystic:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
        }

        /* 长按时的蓄力动画 */
        .btn-mystic.pressing {
            box-shadow: 0 0 35px rgba(0, 216, 255, 0.7), 
                        0 0 15px rgba(139, 92, 246, 0.5),
                        inset 0 0 15px rgba(0, 216, 255, 0.4);
            text-shadow: 0 0 15px rgba(0, 216, 255, 1);
            border-color: rgba(0, 216, 255, 0.9);
            transform: scale(0.98);
            transition: all 2s ease-in;
        }

        /* 状态类 */
        .animate-show {
            animation: fadeInScale 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        .animate-hide {
            animation: fadeOut 0.5s ease forwards;
        }

        .loading-text {
            animation: pulse-text 2s infinite;
            color: var(--accent-cyan);
        }

        /* 答案之书 3D 翻页动效 */
        .mystic-book {
            position: relative;
            width: 80px;
            height: 60px;
            perspective: 800px;
            margin: 0 auto 1.5rem auto;
            transform-style: preserve-3d;
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .book-page {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            right: 0;
            transform-origin: left center;
            border: 1px solid rgba(0, 216, 255, 0.4);
            border-radius: 0 4px 4px 0;
            background: rgba(139, 92, 246, 0.08);
            box-shadow: inset 0 0 12px rgba(0, 216, 255, 0.15);
            transform-style: preserve-3d;
        }

        .book-page.static-left {
            left: 0;
            right: auto;
            transform-origin: right center;
            border-radius: 4px 0 0 4px;
            transform: rotateY(-180deg);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .book-page.static-right {
            z-index: -1;
            border-color: rgba(139, 92, 246, 0.4);
        }

        .book-page.flipping {
            animation: pageFlip 1.2s infinite linear;
            background: rgba(0, 216, 255, 0.08);
            box-shadow: inset 0 0 15px rgba(0, 216, 255, 0.25);
        }

        .book-page.flipping:nth-child(2) { animation-delay: 0s; }
        .book-page.flipping:nth-child(3) { animation-delay: 0.4s; }
        .book-page.flipping:nth-child(4) { animation-delay: 0.8s; }

        @keyframes pageFlip {
            0% { transform: rotateY(0deg); opacity: 1; }
            50% { opacity: 0.8; box-shadow: inset 0 0 25px rgba(139, 92, 246, 0.6); }
            100% { transform: rotateY(-180deg); opacity: 0; }
        }

        /* 书本翻开淡出的特效：模拟从选定页码中浮现答案 */
        .mystic-book.opening {
            transform: scale(2.2) rotateX(15deg) translateY(5px);
            opacity: 0;
            filter: blur(10px);
        }

        /* 音乐浮动按钮 */
        .music-toggle {
            background: rgba(15, 12, 30, 0.4);
            border: 1px solid rgba(0, 216, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 216, 255, 0.1);
        }
        
        .music-toggle.playing {
            animation: music-beat 3s ease-in-out infinite;
            border-color: var(--accent-violet);
            color: #C084FC;
        }
    </style>
</head>
<body class="antialiased h-screen w-full flex items-center justify-center">

    <!-- 氛围背景 (Canvas 星空动效) -->
    <canvas id="star-canvas" class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none"></canvas>

    <!-- 右上角音乐开关 -->
    <button id="music-btn" class="fixed top-6 right-6 z-50 music-toggle p-3.5 rounded-full hover:scale-110 active:scale-95 transition-all duration-300 text-cyan-400 cursor-pointer focus:outline-none" aria-label="Toggle Background Music">
        <!-- 默认静音图标 -->
        <svg id="music-svg" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path id="music-path" stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6L4.5 9H1.5v6h3l4.5 3.75V5.25z" />
        </svg>
    </button>

    <!-- 主容器 -->
    <main class="w-[90%] max-w-md mx-auto relative z-10">
        <div class="glass-panel p-8 sm:p-12 text-center flex flex-col items-center justify-center min-h-[420px]">
            
            <!-- 标题区 -->
            <div id="header-section" class="w-full transition-opacity duration-700">
                <h1 class="text-3xl sm:text-4xl tracking-[0.2em] mb-2 text-white font-light" style="text-shadow: 0 0 15px rgba(139, 92, 246, 0.4);">星辰之引</h1>
                <div class="w-12 h-[1px] bg-gradient-to-r from-[#00D8FF] to-[#8B5CF6] mx-auto my-6 shadow-[0_0_8px_#00D8FF]"></div>
            </div>

            <!-- 内容区 -->
            <div class="relative w-full flex-grow flex items-center justify-center min-h-[170px]">
                
                <!-- 引言状态 -->
                <p id="intro-text" class="absolute w-full text-sm sm:text-base leading-loose text-gray-300 tracking-wider opacity-100 transition-opacity duration-500 z-10">
                    在心中默念你的困惑，<br>保持心境平和。<br>当星辰排列完毕，<br>答案自会显现。
                </p>

                <!-- 翻页动画与加载状态 -->
                <div id="book-container" class="absolute w-full flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-500 z-0">
                    <div id="mystic-book" class="mystic-book">
                        <div class="book-page static-left"></div>
                        <div class="book-page flipping"></div>
                        <div class="book-page flipping"></div>
                        <div class="book-page flipping"></div>
                        <div class="book-page static-right"></div>
                    </div>
                    <p id="loading-text" class="text-sm tracking-widest loading-text transition-opacity duration-500">
                        凝神思考中...
                    </p>
                </div>

                <!-- 答案状态 -->
                <div id="answer-container" class="absolute w-full hidden opacity-0 z-20">
                    <p id="answer-text" class="text-xl sm:text-2xl leading-relaxed text-white font-medium tracking-wide" style="text-shadow: 0 0 20px rgba(0, 216, 255, 0.4);">
                        <!-- 答案渲染区域 -->
                    </p>
                </div>

            </div>

            <!-- 操作区 -->
            <div class="mt-10 w-full relative h-12 flex justify-center items-center">
                <!-- 初始长按按钮 -->
                <button id="action-btn" class="absolute btn-mystic w-full sm:w-4/5 mx-auto py-3 px-6 rounded-full text-sm tracking-[0.2em] uppercase focus:outline-none select-none" style="-webkit-touch-callout: none;">
                    长按凝神 (2秒)
                </button>
                
                <!-- 结果展示后的操作按钮组 -->
                <div id="actions-answered" class="absolute w-full sm:w-4/5 flex justify-between gap-4 hidden opacity-0 transition-opacity duration-500">
                    <button id="share-btn" class="flex-1 btn-mystic py-3 px-2 rounded-full text-xs sm:text-sm tracking-widest focus:outline-none">
                        分享指引
                    </button>
                    <button id="reset-btn" class="flex-1 btn-mystic py-3 px-2 rounded-full text-xs sm:text-sm tracking-widest focus:outline-none">
                        再次提问
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        // 答案数据库
        const answers = [
            // 肯定类
            "这是肯定的。", "完全可行。", "现在是最好的时机。", 
            "无需质疑，去行动吧。", "答案就在你心中，跟随直觉。", 
            "前景一片光明。", "毫无疑问。", "这是必然的结果。", 
            "勇敢地踏出那一步。", "你会得到满意的回报。",

            // 中性/思考类
            "尝试之后便知。", "也许你应该换个角度。", 
            "时机尚未成熟，请再等等。", "取决于你的行动。", 
            "这并不重要，重要的是过程。", "保持耐心，答案正在浮现。", 
            "重新审视你的目标。", "放下执念，顺其自然。", 
            "这是值得探索的方向。", "听听你内心深处的声音。",

            // 否定/警示类
            "目前不宜。", "这可能不是正确的方向。", 
            "暂缓行动，会有更好的选择。", "不要强求。", 
            "那并非你真正想要的。", "避开干扰，保持清醒。", 
            "这会带来意想不到的阻碍。", "保持距离，静观其变。", 
            "这并非最佳选择。", "先冷静下来，再做决定。"
        ];

        // DOM 元素引用
        const btn = document.getElementById('action-btn');
        const introText = document.getElementById('intro-text');
        const bookContainer = document.getElementById('book-container');
        const mysticBook = document.getElementById('mystic-book');
        const loadingText = document.getElementById('loading-text');
        const answerContainer = document.getElementById('answer-container');
        const answerText = document.getElementById('answer-text');
        const actionsAnswered = document.getElementById('actions-answered');
        const shareBtn = document.getElementById('share-btn');
        const resetBtn = document.getElementById('reset-btn');
        const musicBtn = document.getElementById('music-btn');
        const musicPath = document.getElementById('music-path');

        // 应用状态
        let currentState = 'idle'; // idle | loading | answered
        let pressTimer = null;
        let isPressing = false;
        const PRESS_DURATION = 2000;

        // 获取随机答案
        function getRandomAnswer() {
            const randomIndex = Math.floor(Math.random() * answers.length);
            return answers[randomIndex];
        }

        // --- 外部背景音乐播放器 ---
        class AmbientSynthBGM {
            constructor() {
                // 使用 HTTPS 协议防止混合内容拦截导致无法播放
                this.audio = new Audio('https://music.163.com/song/media/outer/url?id=1461528795.mp3');
                this.audio.loop = true;
                this.isPlaying = false;
                
                // 监听实际播放状态，防止交互状态与按钮不一致
                this.audio.addEventListener('play', () => { this.isPlaying = true; });
                this.audio.addEventListener('pause', () => { this.isPlaying = false; });
            }

            play() {
                this.audio.play().catch(e => {
                    console.warn('音乐播放失败，可能需要用户主动触发交互:', e);
                });
            }

            pause() {
                this.audio.pause();
            }
        }

        const bgm = new AmbientSynthBGM();

        // 音乐开关按钮交互
        musicBtn.addEventListener('click', () => {
            if (bgm.isPlaying) {
                bgm.pause();
                musicBtn.classList.remove('playing');
                // 切换为“静音”SVG
                musicPath.setAttribute('d', 'M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6L4.5 9H1.5v6h3l4.5 3.75V5.25z');
            } else {
                bgm.play();
                musicBtn.classList.add('playing');
                // 切换为“有声/波谱”SVG
                musicPath.setAttribute('d', 'M19.113 3.29a.9.9 0 011.253.315C21.152 5.07 21.75 7.14 21.75 9.33c0 2.268-.622 4.4-.1.775a.9.9 0 11-1.57-.872c.4-.72.62-1.554.62-2.433 0-.814-.19-1.583-.532-2.26a.9.9 0 01.315-1.253zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM10.5 5.25L5.625 9H2.25v6h3.375L10.5 18.75V5.25z');
            }
        });

        // Web Audio API：播放单次触发的空灵指引钟音 (长按触发成功时)
        function playMysticBell() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext();
                
                // 基础主音 E5
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime); 
                gain1.gain.setValueAtTime(0, audioCtx.currentTime);
                gain1.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 0.05);
                gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.5);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                
                // 泛音和谐音 E6
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1318.51, audioCtx.currentTime); 
                gain2.gain.setValueAtTime(0, audioCtx.currentTime);
                gain2.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.05);
                gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.2);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                
                osc1.start();
                osc2.start();
                osc1.stop(audioCtx.currentTime + 3.6);
                osc2.stop(audioCtx.currentTime + 2.3);
            } catch(e) { 
                console.warn('Bell sound synthesis failed', e); 
            }
        }

        // --- 核心交互逻辑：长按事件绑定 (兼容鼠标和触摸) ---
        btn.addEventListener('pointerdown', (e) => {
            if (currentState !== 'idle') return;
            isPressing = true;
            btn.textContent = "凝神思考中...";
            btn.classList.add('pressing');
            
            // 立即淡出引言，展示书本翻页动画
            introText.classList.add('opacity-0');
            setTimeout(() => {
                if (!isPressing && currentState === 'idle') return; 
                introText.classList.add('hidden');
                
                bookContainer.classList.remove('hidden');
                loadingText.textContent = "凝神思考中...";
                requestAnimationFrame(() => {
                    bookContainer.classList.remove('opacity-0');
                });
            }, 300);

            pressTimer = setTimeout(() => {
                if (isPressing) {
                    isPressing = false;
                    btn.classList.remove('pressing');
                    playMysticBell();
                    startGuidance();
                }
            }, PRESS_DURATION);
        });

        const cancelPress = () => {
            if (isPressing && currentState === 'idle') {
                isPressing = false;
                clearTimeout(pressTimer);
                btn.textContent = "长按凝神 (2秒)";
                btn.classList.remove('pressing');
                
                // 恢复回引言状态
                bookContainer.classList.add('opacity-0');
                setTimeout(() => {
                    bookContainer.classList.add('hidden');
                    introText.classList.remove('hidden');
                    requestAnimationFrame(() => {
                        introText.classList.remove('opacity-0');
                    });
                }, 300);
            }
        };

        btn.addEventListener('pointerup', cancelPress);
        btn.addEventListener('pointerleave', cancelPress);
        btn.addEventListener('pointercancel', cancelPress);
        
        // 阻止移动端长按弹出系统选择菜单
        btn.addEventListener('contextmenu', (e) => e.preventDefault());

        // 开始指引（加载过程）
        function startGuidance() {
            currentState = 'loading';
            btn.disabled = true;
            btn.textContent = "聆听中...";
            
            loadingText.classList.add('opacity-0');
            setTimeout(() => {
                loadingText.textContent = "正在连接你的潜意识...";
                loadingText.classList.remove('opacity-0');
            }, 300);

            setTimeout(() => {
                showAnswer();
            }, 1500); 
        }

        // 显示答案
        function showAnswer() {
            currentState = 'answered';
            answerText.textContent = getRandomAnswer();

            loadingText.classList.add('opacity-0');
            mysticBook.classList.add('opening');
            
            setTimeout(() => {
                loadingText.classList.add('hidden');
                answerContainer.classList.remove('hidden');
                void answerContainer.offsetWidth; // 触发回流
                answerContainer.classList.remove('opacity-0');
                answerContainer.classList.add('animate-show');
            }, 500);

            btn.classList.add('hidden');
            btn.disabled = false;
            actionsAnswered.classList.remove('hidden');
            setTimeout(() => actionsAnswered.classList.remove('opacity-0'), 5);
        }

        // 分享答案逻辑 (复制到剪贴板)
        shareBtn.addEventListener('click', () => {
            const currentAnswer = answerText.textContent;
            const textToShare = `我在【星辰之引】默念困惑，得到的指引是：\n“${currentAnswer}”`;
            
            const textArea = document.createElement("textarea");
            textArea.value = textToShare;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                const originalText = shareBtn.textContent;
                shareBtn.textContent = "已复制内容";
                shareBtn.classList.add('text-white', 'border-white');
                setTimeout(() => {
                    shareBtn.textContent = originalText;
                    shareBtn.classList.remove('text-white', 'border-white');
                }, 2000);
            } catch (err) {
                console.error('Copy failed', err);
            } finally {
                document.body.removeChild(textArea);
            }
        });

        resetBtn.addEventListener('click', resetGuidance);

        // 重置状态
        function resetGuidance() {
            currentState = 'idle';
            
            answerContainer.classList.add('hidden');
            answerContainer.classList.remove('animate-show');
            answerContainer.classList.add('opacity-0');
            
            mysticBook.classList.remove('opening');
            bookContainer.classList.add('hidden', 'opacity-0');
            loadingText.classList.remove('hidden', 'opacity-0');

            actionsAnswered.classList.add('opacity-0');
            setTimeout(() => {
                actionsAnswered.classList.add('hidden');
                btn.classList.remove('hidden');
                btn.textContent = "长按凝神 (2秒)";
            }, 500);

            introText.classList.remove('hidden');
            setTimeout(() => {
                introText.classList.remove('opacity-0');
            }, 50);
        }

        // --- Canvas 星空动效实现 ---
        function initStarfield() {
            const canvas = document.getElementById('star-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, stars = [], shootingStars = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // 基础群星类 (渐变蓝紫星空闪烁和上升)
            class Star {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 1.5;
                    this.baseAlpha = Math.random() * 0.7 + 0.3;
                    this.alpha = this.baseAlpha;
                    this.speed = Math.random() * 0.2 + 0.05;
                    this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                    this.twinkleDir = Math.random() > 0.5 ? 1 : -1;
                }
                update() {
                    this.y -= this.speed;
                    if (this.y < 0) {
                        this.y = height;
                        this.x = Math.random() * width;
                    }
                    this.alpha += this.twinkleSpeed * this.twinkleDir;
                    if (this.alpha > this.baseAlpha + 0.25 || this.alpha > 1) this.twinkleDir = -1;
                    if (this.alpha < this.baseAlpha - 0.25 || this.alpha < 0.15) this.twinkleDir = 1;
                }
                draw() {
                    ctx.fillStyle = `rgba(226, 232, 240, ${this.alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 流星类 (星云划过)
            class ShootingStar {
                constructor() {
                    this.reset();
                    this.active = false;
                    this.wait = Math.random() * 200 + 100;
                }
                reset() {
                    this.x = Math.random() * width + width / 3;
                    this.y = 0;
                    this.length = Math.random() * 120 + 60;
                    this.speed = Math.random() * 8 + 4;
                    this.angle = Math.PI / 4.5 + (Math.random() * 0.15 - 0.07); 
                    this.size = Math.random() * 1.2 + 0.6;
                    this.active = true;
                    this.wait = Math.random() * 500 + 200;
                }
                update() {
                    if (!this.active) {
                        this.wait--;
                        if (this.wait <= 0) this.reset();
                        return;
                    }
                    this.x -= this.speed * Math.cos(this.angle);
                    this.y += this.speed * Math.sin(this.angle);
                    if (this.x < -this.length || this.y > height + this.length) {
                        this.active = false;
                    }
                }
                draw() {
                    if (!this.active) return;
                    ctx.lineWidth = this.size;
                    const grad = ctx.createLinearGradient(this.x, this.y, this.x + this.length * Math.cos(this.angle), this.y - this.length * Math.sin(this.angle));
                    grad.addColorStop(0, 'rgba(0, 216, 255, 0.7)');
                    grad.addColorStop(0.3, 'rgba(139, 92, 246, 0.4)');
                    grad.addColorStop(1, 'rgba(139, 92, 246, 0)');
                    ctx.strokeStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + this.length * Math.cos(this.angle), this.y - this.length * Math.sin(this.angle));
                    ctx.stroke();
                }
            }

            const starCount = Math.floor((width * height) / 2800);
            for (let i = 0; i < starCount; i++) stars.push(new Star());
            for (let i = 0; i < 2; i++) shootingStars.push(new ShootingStar());

            function animate() {
                // 绘制深蓝紫色调的星际空间底色
                const bgGrad = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height));
                bgGrad.addColorStop(0, '#100b21'); // 核心区深紫罗兰
                bgGrad.addColorStop(0.5, '#0c0818'); // 过渡区深邃午夜蓝
                bgGrad.addColorStop(1, '#050409'); // 边缘无底炭黑
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, width, height);

                stars.forEach(s => { s.update(); s.draw(); });
                shootingStars.forEach(s => { s.update(); s.draw(); });

                requestAnimationFrame(animate);
            }
            animate();
        }

        window.onload = function() {
            initStarfield();
        };
    </script>
</body>
</html>
